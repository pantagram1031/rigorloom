  <line x1="608" y1="313" x2="1416" y2="313" stroke="#E4E4E0" stroke-width="1"/>

  <!-- 자세히 Disclosure collapsed at bottom -->
  <text x="608" y="348" class="muted">자세히 (영수증 검증 · 파일 해시 · 원본 기록 보기)</text>
