  <rect x="68" y="356" width="476" height="64" rx="6" fill="#FFFFFF" stroke="#E4E4E0" stroke-width="1"/>
  <circle cx="48" cy="380" r="5" fill="#8A8984"/>
  <text x="84" y="381" class="semi">원본 문서</text>
