schema: rigorloom-eval-task/v1
id: G1-gianmun-body-edit
family: gongmun
title: 기안문 서식으로 공문 초안 작성
source_scenario: G1-gianmun-body-edit (docs/research/form-eval-scenarios.md, family 2)
note: XC-1 변환본 사용 - 원본은 .hwp. 본문 편집형 과제라 residue 소비 항목이 없어 residue 게이트 대신 보존 검사를 쓴다. gongmun 배포 모듈이 켜져 있으면 check_gongmun 이 구조 규칙(두문/결재란/결문/발신명의/직인/잔여 용어)을 판정한다

prompt: |
  첨부한 기안문 서식으로 공문 초안을 만들어줘.
  - 수신: 국가유산청장
  - 제목: 자료 제출 협조 요청
  - 본문 요지: 2026년도 지역 문화재 보수 실적 자료를 8월 31일까지 제출해 달라는 협조 요청
  결재란과 발신명의는 그대로 둬. 결과는 작업 폴더에 filled.hwpx 로 저장해줘.

input_files:
  - tests/corpus/forms/converted/gianmun-byeolji-1ho.hwpx

# The blank form. Checkers declaring `wants: [baseline]` (check_gongmun) are
# handed this automatically — see evals/README.md §"wants: [baseline]".
baseline: gianmun-byeolji-1ho.hwpx

expected_behavior:
  - "[judgment] 본문이 두문/본문/결문 구성과 서식이 이미 암시하는 항목 번호 체계(1. 가. 1))를 따른다."
  - "[judgment] 비고 블록(이 난은 서식에 포함하지 아니한다)을 서식 밖 작성 안내로 인식하고 초안 산출물에서도 제거했다고 판단 근거와 함께 말한다."
  - "[judgment] 직인 위치와 발신명의 칸을 건드리지 않는다."
  - "[judgment] 수신자 표기 관례(수신자 뒤 경유 칸 처리)를 문서에서 읽어 따른다."

machine_checks:
  - id: profile_blank
    kind: python
    argv: ["engine/scripts/form_inspect.py", "${INPUTS}/gianmun-byeolji-1ho.hwpx", "--out", "${WORK}/blank.profile.json"]
    expect_exit: 0
    json_file: "${WORK}/blank.profile.json"
    assert_json: ["len(anchors) >= 26", "len(table_map) >= 2"]

  - id: filled_produced
    kind: file
    path: "${WORK}/filled.hwpx"
    mode: nonempty

  - id: original_untouched
    kind: unmodified
    input: gianmun-byeolji-1ho.hwpx

  - id: profile_filled
    kind: python
    argv: ["engine/scripts/form_inspect.py", "${WORK}/filled.hwpx", "--out", "${WORK}/filled.profile.json"]
    expect_exit: 0

  - id: geometry_unchanged
    kind: geometry
    description: 결재란 표 기하가 본문 편집으로 흔들리지 않았는가
    before: "${WORK}/blank.profile.json"
    after: "${WORK}/filled.profile.json"

  - id: page_metrics_unchanged
    kind: python
    description: 용지 크기와 여백이 서식 그대로인가
    argv: ["engine/scripts/form_inspect.py", "${WORK}/filled.hwpx", "--out", "${WORK}/filled.profile.json"]
    expect_exit: 0
    json_file: "${WORK}/filled.profile.json"
    assert_json: ["page_metrics.width == 59528", "page_metrics.height == 84188", "page_metrics.margin.left == 5669"]

  - id: form_furniture_intact
    kind: text_present
    description: 결재란/발신명의/직인 자리는 그대로 남아야 한다
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "발신명의"
      - "직인"
      - "행 정 기 관 명"
      - "협조자"

  - id: values_written
    kind: text_present
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "국가유산청장"
      - "자료 제출 협조 요청"

  - id: bigo_removed
    kind: text_absent
    description: 서식 밖 작성 안내인 비고 블록이 초안 산출물에 남지 않았는가
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "이 난은 서식에 포함하지 아니한다"

  # ── gongmun distribution module ──────────────────────────────────────
  # check_gongmun judges the 공문 structure itself: 두문 seats, 결재란 rows,
  # 결문 numbering, 발신명의, the 직인 slot, and the 별지서식 guide vocabulary
  # that must not survive. `requires_module: gongmun` gates both checks on the
  # module being enabled: in a core-only sandbox they are SKIPPED with a
  # recorded reason instead of failing (a missing module is not a product
  # defect — modules/README.md, "absence is not failure").
  # The target IS the baseline here, and a document is never its own baseline:
  # the harness supplies nothing and this stays the no-baseline shape check.
  - id: gongmun_blank_form_shape
    kind: python
    requires_module: gongmun
    description: 빈 서식은 unfilled 형태로 보고되어야 한다 (통과, 크래시 아님)
    argv: ["modules/gongmun/scripts/check_gongmun.py", "${BASELINE}", "--out", "${WORK}/gongmun_blank.json"]
    expect_exit: 0
    json_file: "${WORK}/gongmun_blank.json"
    assert_json:
      - 'document.state == "blank"'
      - "len(document.families) == 5"
      - "counts.hard == 0"

  - id: gongmun_structure
    kind: python
    requires_module: gongmun
    description: 채운 기안문이 공문 구조 규칙을 모두 통과하는가
    # No --baseline here on purpose: check_gongmun declares wants: [baseline],
    # so the harness supplies the task's blank form.
    # The prompt, not a surviving guide block, says this artifact is a draft.
    # Force that requested state explicitly: auto-state treats removal of the
    # out-of-form 비고 as final evidence, which made the old task require the
    # very guide text that visual verification correctly rejects (T45).
    argv: ["modules/gongmun/scripts/check_gongmun.py", "${WORK}/filled.hwpx", "--mode", "draft", "--out", "${WORK}/gongmun_verdict.json"]
    expect_exit: 0
    json_file: "${WORK}/gongmun_verdict.json"
    assert_json:
      - "counts.hard == 0"
      - 'checker == "check_gongmun"'
      # 결재란과 발신명의를 그대로 두라고 했으므로 완성 공문이 아니라 기안 초안
      - 'document.state_used == "draft"'
