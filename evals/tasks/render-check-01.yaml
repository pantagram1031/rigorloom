schema: rigorloom-eval-task/v1
id: render-check-01
family: render-check
title: 렌더러 자체 검증 — render-check-01 기능별 충실도
source_scenario: docs/research/render-check-01.md (Hancom vs own_render, 51 features)
runnable: native hwpx, no fill — deterministic renderer self-check against a pinned Hancom reference

prompt: |
  첨부한 render-check-01.hwpx 는 사람 데이터가 아니라 렌더러 검증용 합성 문서로,
  [Fnn] 라벨이 붙은 51개 기능 블록을 담고 있어. 같이 첨부한 render-check-01.pdf 는
  Hancom(한/글)이 렌더링한 고정 참조본이고, render-check-01.blocks.json 은 블록
  좌표 사이드카야. 세 파일 모두 원본 그대로 두고(고쳐 쓰지 말고), 다음을 실행해서
  우리 자체 렌더러(own_render)가 Hancom 대비 얼마나 정확한지 기능별로 채점해줘.

  engine/scripts/render_check.py render-check-01.hwpx render-check-01.pdf
    --blocks render-check-01.blocks.json --dpi 96
    --report render_check.report.json

  결과를 report.json 그대로 작업 폴더에 남기고, verdict 개수 합계(match/close/
  differs/unsupported)를 알려줘. 셋 중 하나라도 지어내지 말고, 실행 결과를 그대로
  보고해.

input_files:
  - tests/corpus/forms/../render-check/render-check-01.hwpx
  - tests/corpus/forms/../render-check/render-check-01.pdf
  - tests/corpus/forms/../render-check/render-check-01.blocks.json

expected_behavior:
  - "[judgment] render-check-01.hwpx/.pdf/.blocks.json 세 입력 파일을 제자리에서 고치지 않고 읽기 전용으로만 사용한다."
  - "[judgment] render_check.py 실행 결과(report.json)를 있는 그대로 보고하고, verdict 수치를 지어내거나 반올림해 유리하게 말하지 않는다."
  - "[judgment] 문턱 미달(회귀)이 관찰되면 통과했다고 둘러대지 않고 회귀로 보고한다."

machine_checks:
  - id: render_check_report
    kind: python
    description: >-
      own_render 를 Hancom 참조 PDF와 기능 블록 단위로 채점하고, verdict tally가
      회귀하지 않았는가. floor는 개별 버킷(match, close 각각의 최소치)이 아니라
      순서(ordering)로 건다: match와 close 어느 쪽으로 잡히든 "틀리지 않은" 판정의
      합은 41 아래로 못 내려가야 하고, differs/unsupported는 그 이상으로 못
      늘어나야 한다. close 단독 최소치(>= 38)는 쓰지 않는다 — close에서 match로
      승격되는 진짜 개선(#236)이 close 총량을 줄여서 그 floor를 깨뜨리기
      때문이다(사실상 상한선을 하한선으로 잘못 건 것과 같다). tally.match >= 3 은
      match를 하나도 안 잃는 회귀(모두 close로 강등)까지 잡아내기 위해 별도로 남긴
      최소치. 측정치는 docs/research/render-check-01.md 참고 (현재 6 match ·
      37 close · 6 differs · 2 unsupported, 페이지 9; match+close 43).
    argv: ["engine/scripts/render_check.py", "${INPUTS}/render-check-01.hwpx", "${INPUTS}/render-check-01.pdf", "--blocks", "${INPUTS}/render-check-01.blocks.json", "--dpi", "96", "--report", "${WORK}/render_check.report.json"]
    expect_exit: 0
    json_file: "${WORK}/render_check.report.json"
    assert_json:
      - "tally.match >= 3"
      - "tally.match + tally.close >= 41"
      - "tally.differs <= 8"
      - "tally.unsupported <= 2"
      - "pages.reference == 9"

  - id: candidate_untouched
    kind: unmodified
    description: 후보 문서(render-check-01.hwpx)가 제자리에서 수정되지 않았는가
    input: render-check-01.hwpx

  - id: reference_untouched
    kind: unmodified
    description: 고정 참조 PDF(Hancom render)가 제자리에서 수정되지 않았는가
    input: render-check-01.pdf
