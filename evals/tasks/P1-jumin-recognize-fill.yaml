schema: rigorloom-eval-task/v1
id: P1-jumin-recognize-fill
family: petition
title: 주민등록표 등초본 교부 신청서 인식 및 채우기
source_scenario: P1-recognize-fill-jumin (docs/research/form-eval-scenarios.md, family 1)
note: XC-1 변환본 사용 - 원본은 .hwp. minwon 배포 모듈이 켜져 있으면 check_minwon 이 서식 규칙(별지서식 프레임/접수 칸/선택 항목/서명란/유의사항 보존/신분번호 비생성)을 판정한다

prompt: |
  첨부한 주민등록표 등초본 교부 신청서를 열어서 신청인(개인) 칸에 채울 항목이 뭔지 알려주고,
  아래 값으로 채워줘. 양식 모양은 절대 바뀌면 안 돼.
  - 성명: 김도현
  - 주소: 서울특별시 강남구 테헤란로 100
  - 연락처: 010-0000-0000
  - 신청 내용: 주민등록표 등본 1통, 용도는 은행 제출용
  결과는 작업 폴더에 filled.hwpx 로 저장해줘.

input_files:
  - tests/corpus/forms/converted/jumin-deungchobon-sinchengseo.hwpx

# The blank form. Checkers declaring `wants: [baseline]` (check_minwon) are
# handed this automatically — see evals/README.md §"wants: [baseline]". Without
# it the minwon checks below would be SKIPPED with a reason, because ten of
# check_minwon's thirteen structural rules are preservation rules that need the
# blank form.
baseline: jumin-deungchobon-sinchengseo.hwpx

expected_behavior:
  - "[judgment] 접수번호, 접수일, 처리기간 같은 담당 공무원 전용 칸(음영 칸)을 알아보고 쓰지 않는다."
  - "[judgment] 체크 표시는 [ ] 안에 √ 를 넣는 텍스트 토글로 처리한다. 폼 필드 객체로 바꾸지 않는다."
  - "[judgment] 주민등록번호는 사용자가 주지 않았으므로 비워 두고, 필요하면 사용자에게 요청한다. 절대 임의 생성하지 않는다."
  - "[judgment] 3쪽 유의 사항 안내문은 삭제하지 않는다."
  - "[judgment] 서명란은 사람 몫으로 남긴다."

machine_checks:
  - id: profile_blank
    kind: python
    description: 조밀 그리드 인식 하한
    argv: ["engine/scripts/form_inspect.py", "${INPUTS}/jumin-deungchobon-sinchengseo.hwpx", "--out", "${WORK}/blank.profile.json"]
    expect_exit: 0
    json_file: "${WORK}/blank.profile.json"
    assert_json: ["len(anchors) >= 60", "len(table_map) >= 3", "len(table_map[0].cells) >= 30"]

  - id: filled_produced
    kind: file
    path: "${WORK}/filled.hwpx"
    mode: nonempty

  - id: original_untouched
    kind: unmodified
    input: jumin-deungchobon-sinchengseo.hwpx

  - id: profile_filled
    kind: python
    argv: ["engine/scripts/form_inspect.py", "${WORK}/filled.hwpx", "--out", "${WORK}/filled.profile.json"]
    expect_exit: 0

  - id: geometry_unchanged
    kind: geometry
    before: "${WORK}/blank.profile.json"
    after: "${WORK}/filled.profile.json"

  - id: residue_clean
    kind: residue
    profile: "${WORK}/blank.profile.json"
    artifact: "${WORK}/filled.hwpx"
    baseline: "${INPUTS}/jumin-deungchobon-sinchengseo.hwpx"
    expect_exit: 0
    require_consumed: 1

  - id: guidance_and_signature_protected
    kind: text_present
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "3쪽의 유의 사항을 읽고 작성하시기 바라며"
      - "(서명 또는 인)"
      - "주민등록표 열람 또는 등ㆍ초본 교부 신청서"

  - id: values_written
    kind: text_present
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "김도현"
      - "테헤란로 100"

  # ── minwon distribution module ────────────────────────────────────────
  # check_minwon judges the 민원 서식 itself: the 별지서식 frame (header line,
  # 210mm×297mm footer, 귀하 addressee), the 접수·처리 기관 seats a citizen must
  # not fill, 선택 항목 slot preservation, the 서명 markers that stay for a human,
  # the 유의사항 / 수수료 / 제출서류 guide blocks that must SURVIVE, and — the rule
  # that turns three of the judgment lines above into a machine check — that no
  # 주민등록번호 was invented. `requires_module: minwon` gates both checks on the
  # module being enabled: in a core-only sandbox they are SKIPPED with a recorded
  # reason instead of failing (a missing module is not a product defect —
  # modules/README.md, "absence is not failure").
  # The target IS the baseline here, and a document is never its own baseline:
  # the harness supplies nothing and this stays the no-baseline shape check.
  - id: minwon_blank_form_shape
    kind: python
    requires_module: minwon
    description: 빈 서식은 unfilled 형태로 보고되어야 한다 (통과, 크래시 아님)
    argv: ["modules/minwon/scripts/check_minwon.py", "${BASELINE}", "--out", "${WORK}/minwon_blank.json"]
    expect_exit: 0
    json_file: "${WORK}/minwon_blank.json"
    assert_json:
      - 'document.state == "blank"'
      - "len(document.families) >= 5"
      - "counts.hard == 0"
      - "document.marked_checkboxes == 0"

  - id: minwon_structure
    kind: python
    requires_module: minwon
    description: 채운 신청서가 민원 서식 규칙을 모두 통과하는가 (신분번호 임의 생성 포함)
    # No --baseline here on purpose: check_minwon declares wants: [baseline],
    # so the harness supplies the task's blank form. --fill-map is deliberately
    # NOT supplied: the prompt gives no 주민등록번호, so ANY identity number in
    # the artifact is undeclared and identity_value_invented fires.
    argv: ["modules/minwon/scripts/check_minwon.py", "${WORK}/filled.hwpx", "--out", "${WORK}/minwon_verdict.json"]
    expect_exit: 0
    json_file: "${WORK}/minwon_verdict.json"
    assert_json:
      - "counts.hard == 0"
      - 'checker == "check_minwon"'
      # cells_changed is only computed when a baseline model is present, so a
      # non-zero value proves BOTH that the harness supplied the blank form and
      # that the agent actually wrote into the grid.
      - "document.cells_changed >= 1"
