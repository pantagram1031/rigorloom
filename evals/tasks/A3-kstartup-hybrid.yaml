schema: rigorloom-eval-task/v1
id: A3-kstartup-hybrid
family: grant
title: 창업 지원사업 신청서 + 사업계획서 혼합 양식
source_scenario: A3-kstartup-hybrid (docs/research/form-eval-scenarios.md, family 6)
note: XC-1 변환본 사용 - 고정 그리드와 흐르는 본문이 한 문서에 공존하는 유일한 코퍼스 멤버

prompt: |
  첨부한 지원사업 신청서 겸 사업계획서 양식에서 앞쪽 신청서 표를 아래 값으로 채우고,
  사업계획서의 창업아이템 개요 섹션 초안을 한 번의 실행으로 써줘.
  - 과제(창업아이템)명: 저전력 초음파 누수 탐지 모듈
  - 신청자 성명: 이서준
  - 이전기술 구분: 기술이전 완료
  결과는 작업 폴더에 filled.hwpx 로 저장해줘.

input_files:
  - tests/corpus/forms/converted/kstartup-jiwon-sincheongseo-saeopgyehoekseo.hwpx

# The blank form, handed to checkers declaring `wants: [baseline]` (check_grant)
# — see evals/README.md §"wants: [baseline]". This is the corpus member that
# makes the declaration matter most: the form ships PRE-FILLED with worked
# examples (nine budget figures, a marked ■동의함, ~~~~ / ㅇㅇㅇ stand-ins), so
# without the blank form there is no evidence of writing to read and
# document.state_basis falls back to "date_seat_only".
baseline: kstartup-jiwon-sincheongseo-saeopgyehoekseo.hwpx

# Values this prompt names that no machine check asserts, with the reason.
# tests/test_prompt_values_are_accounted.py parses the prompt and fails on any
# value that is neither asserted nor listed here, so the gap between what was
# asked and what is checked stays counted rather than silent (#61).
unasserted_prompt_values:
  - value: "기술이전 완료"
    why: in_blank_form
    note: >-
      measured: already in the blank form's extracted text, so text_present cannot tell a fill from a no-op

expected_behavior:
  - "[judgment] 고정 그리드(신청서 표)와 흐르는 본문(사업계획서)을 서로 다른 편집 체제로 다룬다. 표에는 값만 넣고, 본문에는 산문을 쓴다."
  - "[judgment] 색이 들어간 작성 안내문을 본문 초안과 구분하고, 지울지 남길지 판단 근거를 밝힌다."
  - "[judgment] 공고가 선언한 분량 제한이 문서 안에 있으면 찾아서 인용하고 그 안에서 쓴다."
  - "[judgment] 사용자가 주지 않은 값은 지어내지 않는다."
  - "[judgment] 붙임/별첨 참조를 구분한다. 【별첨 N】 은 이 파일 안의 절이고 붙임 N 은 공고문 첨부물이다. 파일 안의 절을 지우면서 그 참조를 남기지 않는다."
  - "[judgment] 예산표 행을 늘리는 것은 정당하지만 열 구성은 바꾸지 않는다. 행을 건드렸으면 합계를 다시 계산한다."
  - "[judgment] 동의 여부는 사람이 결정한다. ■동의함 이 미리 찍혀 있어도 무엇에 동의하는지 먼저 요약해 알린다."

machine_checks:
  - id: profile_blank
    kind: python
    description: 혼합 양식 프로파일링 - 다중 섹션 인식 하한
    argv: ["engine/scripts/form_inspect.py", "${INPUTS}/kstartup-jiwon-sincheongseo-saeopgyehoekseo.hwpx", "--out", "${WORK}/blank.profile.json"]
    expect_exit: 0
    json_file: "${WORK}/blank.profile.json"
    assert_json: ["len(anchors) >= 300", "len(table_map) >= 35", "len(guide_text) >= 100"]

  - id: filled_produced
    kind: file
    path: "${WORK}/filled.hwpx"
    mode: nonempty

  - id: original_untouched
    kind: unmodified
    input: kstartup-jiwon-sincheongseo-saeopgyehoekseo.hwpx

  - id: profile_filled
    kind: python
    argv: ["engine/scripts/form_inspect.py", "${WORK}/filled.hwpx", "--out", "${WORK}/filled.profile.json"]
    expect_exit: 0

  - id: geometry_unchanged
    kind: geometry
    description: 앞쪽 신청서 그리드가 본문 편집에 흔들리지 않았는가
    before: "${WORK}/blank.profile.json"
    after: "${WORK}/filled.profile.json"

  - id: residue_clean
    kind: residue
    profile: "${WORK}/blank.profile.json"
    artifact: "${WORK}/filled.hwpx"
    baseline: "${INPUTS}/kstartup-jiwon-sincheongseo-saeopgyehoekseo.hwpx"
    expect_exit: 0
    require_consumed: 1

  - id: values_written
    kind: text_present
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "저전력 초음파 누수 탐지 모듈"

  - id: page_budget
    kind: python
    description: 공고가 선언한 쪽수 제한 준수 여부
    argv: ["engine/scripts/layout_qa.py", "--file", "${WORK}/verify.pdf"]
    expect_exit: 0
    blocked_on: PDF 렌더러가 있는 운영자 머신에서만 평가 가능 (클린룸에는 렌더러가 없다)

  # ── grant distribution module ────────────────────────────────────────
  # 이 코퍼스 멤버가 지원사업 계열의 성격을 전부 보여준다: 신청서 그리드 +
  # 흐르는 사업계획서 + 【별첨】 절 + 공고문 붙임 참조 + =SUM() 합계가 걸린 예산표
  # 3개 + 미리 표시된 필수 동의 2개 + 시트별 서명란 6개. check_grant 가 판정하는
  # 것: 참조 해소, 표의 열 구성(행 추가는 정당), 합계 산술, 동의, 서명란,
  # 개인번호 비생성, 그리고 양식이 스스로 지우라고 한 안내문·예시 자리표시자.
  # `requires_module: grant` 로 게이트된다 (modules/README.md).
  - id: grant_blank_form_shape
    kind: python
    requires_module: grant
    description: 빈 혼합 양식이 여섯 계열 전부와 균형 잡힌 합계로 인식되는가
    argv: ["modules/grant/scripts/check_grant.py", "${BASELINE}", "--out", "${WORK}/grant_blank.json"]
    expect_exit: 0
    json_file: "${WORK}/grant_blank.json"
    assert_json:
      - 'document.state == "blank"'
      - "counts.hard == 0"
      - "len(document.families) == 6"
      # 예시 값이 미리 채워져 있어도 blank 로 읽혀야 한다: 표시된 동의 2개와
      # 예산 숫자는 '누가 썼다'는 증거가 아니다
      - "document.marked_consent_options == 2"

  - id: grant_structure
    kind: python
    requires_module: grant
    description: 채운 패킷이 지원사업 서식 규칙을 모두 통과하는가
    # No --baseline in argv on purpose: check_grant declares wants: [baseline]
    # and the harness supplies the task's blank form.
    argv: ["modules/grant/scripts/check_grant.py", "${WORK}/filled.hwpx", "--out", "${WORK}/grant_verdict.json"]
    expect_exit: 0
    json_file: "${WORK}/grant_verdict.json"
    assert_json:
      - "counts.hard == 0"
      - 'checker == "check_grant"'
      - "document.seats_changed >= 1"
      - 'document.state_basis == "baseline_diff"'

  - id: grant_packet_and_geometry_rules_were_decided
    kind: file
    requires_module: grant
    description: 패킷 참조·표 기하·합계 규칙이 각각 어떤 결과였는지 이름으로 확인
    # T118: 이 검사는 예전에 text_absent 였다 — "이름이 결과 JSON에 없으면
    # 규칙이 실행되어 통과했다"는 규약을 쓴 것인데, 그 규약은 참이 아니었다.
    # check_grant 는 규칙 이름을 세 가지 뜻으로 적는다: 적발(fired), 긍정 확인
    # (예: self_deleting_guide_retained state=clean), 그리고 이유를 붙인 영구
    # skip. 직렬화된 판정문에 대한 부분 문자열 검색은 그 셋을 구별할 수 없다.
    # 실측: 손대지 않은 빈 양식(check_grant 가 pass 로 채점한다)의 판정문에도
    # budget_total_mismatch 가 skipped 행으로 들어 있어서, 이 검사는 완벽한
    # 채움에서도 원본에서도 통과할 수 없었다.
    #
    # 이제 checker 가 규칙별 결과를 `rules` 맵으로 직접 발행하므로 의도를
    # 그대로 적는다. budget_total_mismatch 가 "skipped" 인 것은 이 코퍼스
    # 멤버의 측정된 사실이다 — 합계 셀(표 11, addr[5,5])에 더할 항이 없어서
    # no_addends 로 건너뛴다. 그 사실이 바뀌면 이 줄이 실패하고, 그때
    # 판단하는 것이 맞다.
    path: "${WORK}/grant_verdict.json"
    mode: nonempty
    json_file: "${WORK}/grant_verdict.json"
    assert_json:
      - 'rules.packet_reference_dangling != "hard"'
      - 'rules.packet_section_lost != "hard"'
      - 'rules.table_column_changed != "hard"'
      - 'rules.table_structure_lost != "hard"'
      - 'rules.budget_total_mismatch != "hard"'
      - 'rules.consent_block_lost != "hard"'
      - 'rules.consent_option_lost != "hard"'
      - 'rules.consent_unmarked != "hard"'
      - 'rules.signature_seat_lost != "hard"'
      - 'rules.identity_value_invented != "hard"'
      - 'rules.account_number_invented != "hard"'
      - 'rules.self_deleting_guide_retained != "hard"'
      - 'rules.example_placeholder_retained != "hard"'
      - 'rules.budget_total_mismatch == "skipped"'

  - id: grant_external_attachment_refs_are_not_dangling
    kind: text_present
    requires_module: grant
    description: 붙임 3 / 붙임 5 는 공고문 첨부물이므로 external 로 보고된다
    # 이 계열에서 가장 쉽게 틀리는 지점: "모든 붙임/별첨 참조는 해소되어야 한다"
    # 라고 쓰면 빈 양식에서 이미 4번 걸린다.
    artifact: "${WORK}/grant_verdict.json"
    strings:
      - "external"

  - id: grant_length_budget_dependency_is_declared
    kind: file
    requires_module: grant
    description: 분량 제한 규칙은 추측하지 않고 의존성을 선언한다
    # 이 양식은 쪽수 제한을 선언하지 않으므로 not_declared 로 기록된다. 선언한
    # 양식이라면 needs_render 로 기록되고 visual_verify 가 주인이라고 명시한다.
    # T118: was text_present on the rule NAME. The name being present was
    # the old "it skipped" signal; the outcome map says it exactly, and a
    # name search would also match a finding that mentioned it.
    path: "${WORK}/grant_verdict.json"
    mode: nonempty
    json_file: "${WORK}/grant_verdict.json"
    assert_json:
      - 'rules.length_budget_unverified == "skipped"'
  - id: requested_values_present
    kind: text_present
    description: 프롬프트가 준 값이 실제로 산출물에 들어갔는가 (#61)
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "이서준"
