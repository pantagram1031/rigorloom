schema: rigorloom-eval-task/v1
id: A1-pps-recognize-fill
family: grant
title: 조달청 협업 승인 신청서 인식 및 채우기
source_scenario: A1-pps-recognize-fill (docs/research/form-eval-scenarios.md, family 6)
runnable: native hwpx, no conversion needed

prompt: |
  첨부한 협업 승인 신청서 양식을 열어서 어떤 항목을 채워야 하는지 먼저 알려주고,
  아래 값으로 채워줘. 양식 모양은 절대 바뀌면 안 돼.
  - 기업명: 한빛정밀 주식회사
  - 사업자등록번호: 214-81-00000
  - 주소: 서울특별시 강남구 테헤란로 100
  - 홈페이지: http://hanbit-precision.example.kr
  - 대표자명: 김도현
  - 총괄책임자 성명: 이서준, 소속/직위: 기술연구소 책임연구원
  - 전화: 02-000-0000 (메일주소는 아직 정해지지 않았어)
  - 협업제품명: 저진동 정밀 이송 스테이지
  - 협업기간: 2026년 9월부터 2027년 8월까지
  - 신청일: 2026년 8월 20일
  결과는 작업 폴더에 filled.hwpx 로 저장해줘.

input_files:
  - tests/corpus/forms/grant/pps-hyeopeop-seungin-sinchengseo.hwpx

expected_behavior:
  - "[judgment] 채우기 전에 어떤 칸이 입력 대상인지 문서에서 읽어 목록으로 제시한다 (사전 지식이 아니라 프로파일 결과와 문서 텍스트 근거)."
  - "[judgment] 서명 칸(신청인 ... (서명 또는 인))은 비워 두고 사람이 서명해야 한다고 알려준다. 자동으로 이름을 써넣지 않는다."
  - "[judgment] 사용자가 주지 않은 값(법인등록번호, FAX, 참여기업)은 지어내지 않고 비워 둔 채 되돌려 알려준다."
  - "[judgment] 원본을 덮어쓰지 않고 사본에 작업했다고 명시한다."
  - "[judgment] 첨부서류 안내 문구를 삭제하지 않는다."

machine_checks:
  - id: profile_blank
    kind: python
    description: 빈 양식 프로파일링 - Bench-0 고정 하한
    argv: ["engine/scripts/form_inspect.py", "${INPUTS}/pps-hyeopeop-seungin-sinchengseo.hwpx", "--out", "${WORK}/blank.profile.json"]
    expect_exit: 0
    json_file: "${WORK}/blank.profile.json"
    assert_json: ["len(anchors) >= 29", "len(table_map) == 1", "len(table_map[0].cells) == 45"]

  - id: filled_produced
    kind: file
    description: 에이전트가 filled.hwpx 를 만들었는가
    path: "${WORK}/filled.hwpx"
    mode: nonempty

  - id: original_untouched
    kind: unmodified
    description: 입력 양식이 제자리에서 수정되지 않았는가 (비파괴 계약)
    input: pps-hyeopeop-seungin-sinchengseo.hwpx

  - id: profile_filled
    kind: python
    description: 채운 결과 프로파일링
    argv: ["engine/scripts/form_inspect.py", "${WORK}/filled.hwpx", "--out", "${WORK}/filled.profile.json"]
    expect_exit: 0

  - id: geometry_unchanged
    kind: geometry
    description: 표 기하(셀 주소/크기/borderFill/음영)가 빈 양식과 동일한가
    before: "${WORK}/blank.profile.json"
    after: "${WORK}/filled.profile.json"

  - id: residue_clean
    kind: residue
    description: check_residue 통과 + 최소 1개 항목이 실제로 소비되었는가 (비공허성)
    profile: "${WORK}/blank.profile.json"
    artifact: "${WORK}/filled.hwpx"
    baseline: "${INPUTS}/pps-hyeopeop-seungin-sinchengseo.hwpx"
    expect_exit: 0
    require_consumed: 1

  - id: protected_prose_survives
    kind: text_present
    description: 서명란과 안내 문구는 살아남아야 한다
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "(서명 또는 인)"
      - "협업 승인 신청서"
      - "본 협업승인 신청서는 1차 심사 통과기업에 한해 제출"
      - "조달청장  귀하"

  - id: values_written
    kind: text_present
    description: 사용자가 준 값이 실제로 문서에 들어갔는가
    artifact: "${WORK}/filled.hwpx"
    strings:
      - "한빛정밀"
      - "저진동 정밀 이송 스테이지"

  - id: repeat_fill_idempotent
    kind: idempotence
    description: 같은 채우기를 한 번 더 돌렸을 때 내용이 동일한가
    before: "${WORK}/filled.hwpx"
    after: "${WORK}/filled2.hwpx"
    blocked_on: 반복 채우기 프로토콜(선택)을 수행해 filled2.hwpx 를 만든 런에서만 평가한다
