# Style distribution module — declaration (schema: pipeline/references/module.schema.json).
# Wave 4.2: the humanization stack (humanization_ctl + prose_fidelity +
# check_style) is one distribution module. prose_fidelity.py is payload the
# controller imports as a sibling, not a declared checker (it audits text
# pairs, not a workspace). The skill fragment is a later slice; references/
# holds its material (agent.humanizer.template.md). No pack_types: the
# prose_rules pack type is core-general ("writing voice" in plan §4.1) —
# this module consumes it, it does not own it. No preflight contributions.
schema: rigorloom-module/v1
name: style
requires: {rigorloom: ">=0.16"}
provides:
  checkers:
    - {name: check_style, script: scripts/check_style.py}
  cli:
    - {command: humanize, script: scripts/humanization_ctl.py}
