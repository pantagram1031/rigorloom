[project]
name = "rigorloom"
version = "0.16.0"
description = "Agent-neutral, resumable report workflow"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
studio = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "pymupdf>=1.23"]
engine = ["pillow>=10", "pymupdf>=1.23", "pyyaml>=6"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
# MODULE-AGNOSTIC by contract (modules/README.md rule 4: "adding a module
# later requires no core change"). The previous hardcoded per-module list
# meant every new distribution module needed an edit here — a core change,
# which is exactly what the rule forbids. pytest expands each testpaths entry
# with ``glob.iglob`` (Config._decide_args), so ``modules/*/tests`` picks up
# any module's suite without naming it. Entries that match nothing are simply
# dropped, so a core-only checkout (no module payloads) is fine too.
#
# Proven by pipeline/tests/test_module_registry.py::TestHarnessIsModuleAgnostic,
# which drops a brand-new module into a synthetic root carrying THIS ini block
# verbatim and asserts pytest collects its tests — so a pytest that did NOT
# glob testpaths would fail the suite loudly instead of silently skipping
# every module test.
testpaths = [
    "tests",
    "pipeline/tests",
    "engine/tests",
    "modules/*/tests",
]
# Test basenames must be unique across the whole suite: the default prepend
# import mode names a test module after its basename alone, so two modules
# shipping the same filename collide ("import file mismatch"). importlib mode
# would fix that but drops the test dir from sys.path, breaking the suite's
# sibling imports (tests/_module_gating.py). The property is enforced instead
# by pipeline/tests/test_module_registry.py::TestHarnessIsModuleAgnostic.
addopts = "-ra"
