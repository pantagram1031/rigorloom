[build-system]
# Declared so `pip wheel` / `pip install .` have a backend at all. Pinned to a
# floor, never an upper bound: the wheel is pure Python and must build with
# whatever setuptools the operator already has, offline, under
# --no-build-isolation. setuptools < 70.1 additionally needs the separate
# `wheel` distribution for bdist_wheel; that is an environment fact, recorded
# in tests/test_cli_distribution.py rather than papered over by a download.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rigorloom"
version = "0.18.0"
description = "Agent-neutral, resumable report workflow"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
# ONE implementation. This resolves to the same ``main`` that
# ``python runtime/scripts/cli.py`` runs -- the wheel repackages that file, it
# does not fork it. tests/test_cli_distribution.py compares the installed
# cli.py with the checkout's byte for byte, so a divergent copy fails there.
rigorloom = "rigorloom_runtime.cli:main"

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
studio = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "pymupdf>=1.23"]
engine = ["pillow>=10", "pymupdf>=1.23", "pyyaml>=6"]
test = ["pytest>=8"]
poster = ["python-pptx>=0.6.21", "pillow>=10"]

[tool.pytest.ini_options]
# MODULE-AGNOSTIC by contract (modules/README.md rule 4: "adding a module
# later requires no core change"). The previous hardcoded per-module list
# meant every new distribution module needed an edit here — a core change,
# which is exactly what the rule forbids. pytest expands each testpaths entry
# with ``glob.iglob`` (Config._decide_args), so ``modules/*/tests`` picks up
# any module's suite without naming it. Entries that match nothing are simply
# dropped, so a core-only checkout (no module payloads) is fine too.
#
# Proven by pipeline/tests/test_module_registry.py::TestHarnessIsModuleAgnostic,
# which drops a brand-new module into a synthetic root carrying THIS ini block
# verbatim and asserts pytest collects its tests — so a pytest that did NOT
# glob testpaths would fail the suite loudly instead of silently skipping
# every module test.
testpaths = [
    "tests",
    "pipeline/tests",
    "engine/tests",
    "modules/*/tests",
]
# Test basenames must be unique across the whole suite: the default prepend
# import mode names a test module after its basename alone, so two modules
# shipping the same filename collide ("import file mismatch"). importlib mode
# would fix that but drops the test dir from sys.path, breaking the suite's
# sibling imports (tests/_module_gating.py). The property is enforced instead
# by pipeline/tests/test_module_registry.py::TestHarnessIsModuleAgnostic.
addopts = "-ra"
# Machine/font-sensitive own_render research pins (measured-vs-pinned
# LINESEG / face / spacing numbers). Skipped on GitHub Actions via
# ``@research_pin`` in engine/tests/test_own_render.py — rematch freeze.
# Collect locally with ``pytest -m research``; CI never rematches them.
markers = [
    "research: own_render research pins; skipped on GITHUB_ACTIONS (rematch freeze)",
]

# --- wheel surface ------------------------------------------------------------
# An ALLOWLIST, not a sweep. This repository is a flat layout with twelve
# importable top-level directories (qa, evals, skill, engine, studio, archive,
# desktop, modules, runtime, adapters, pipeline, agenthost). Automatic discovery
# refuses to guess among them -- "Multiple top-level packages discovered in a
# flat-layout" -- and any fix that merely silences that refusal would ship
# unreleased desktop work, the QA corpus, and other people's evidence.
#
# So the wheel carries exactly one package: the Runtime layer, installed under a
# namespaced name because ``runtime`` is far too generic to own in site-packages.
# Everything else stays a checkout concern and is reported unavailable at
# runtime with a reason (see EngineTools.availability), never silently claimed.
#
# This does NOT replace the module/skill ZIP distribution
# (scripts/package_module.py, scripts/sync_local.py, evals/cleanroom.py). That
# path ships module payloads and skill fragments; this one ships a command.
[tool.setuptools]
packages = ["rigorloom_runtime"]
# Explicitly false: the package list is the whole allowlist, and data sweeping
# would quietly widen it again.
include-package-data = false

[tool.setuptools.package-dir]
rigorloom_runtime = "runtime/scripts"
