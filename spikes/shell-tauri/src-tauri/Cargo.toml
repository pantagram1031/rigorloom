[package]
name = "rigorloom-shell-spike"
version = "0.0.0"
description = "Throwaway Tauri 2 shell spike for the rigorloom desktop program"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# M11 mitigation: kill the sidecar tree when the shell dies, including when the
# shell is SIGKILL-equivalent-killed and no Rust cleanup runs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
