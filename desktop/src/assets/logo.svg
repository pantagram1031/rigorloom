<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" role="img" aria-label="Rigorloom">
  <!--
    The Rigorloom mark (리을R), the drawing of record. The Tauri icon set and
    favicon are generated from it by desktop/scripts/make_icons.py.

    One thread on a 16-unit grid, drawn without lifting: up the stem, along the
    top, round the bowl, back left, down, and out along the foot. Read with the
    stem it is an R; cover the stem and the same line is the Hangul ㄹ, so the
    Latin and Korean initials of the name share one stroke.

    Stroke 1.5 with straight edges on half units. At 20 px and below the
    16-px cut (logo-16.svg: stroke 2, whole-unit edges, a 2-unit gap between
    the stem and the inner leg) is used so the two uprights never merge.
  -->
  <path d="M3.25 14.5V2.25H9A2.75 2.75 0 0 1 11.75 5V5.5A2.75 2.75 0 0 1 9 8.25H6.75V13.75H13.5"/>
</svg>
